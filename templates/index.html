<!doctype html><html><body style="font-family:Arial;max-width:800px;margin:40px auto"><h1>Security Orchestration Platform</h1><p>Safe lab-only playbook simulation.</p>{% for n in playbooks %}<button onclick="run('{{n}}')">{{n}}</button>{% endfor %}<pre id="o"></pre><script>async function run(n){let r=await fetch('/api/run',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({playbook:n})});o.textContent=JSON.stringify(await r.json(),null,2)}</script></body></html>
